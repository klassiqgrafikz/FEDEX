<div class="fxg-admin-section">
    <div class="fxg-admin-section__header">
        <h2 class="fxg-admin-section__title">Manage Pages</h2>
        <button class="fxg-admin-btn fxg-admin-btn--outline fxg-admin-btn--small" onclick="loadPages()">Refresh</button>
    </div>
    <div id="pagesAlert"></div>
</div>
<div class="fxg-admin-table">
    <table>
        <thead><tr><th>Title</th><th>Slug</th><th>Active</th><th style="width:120px">Actions</th></tr></thead>
        <tbody id="pagesTable"><tr><td colspan="4" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
</div>
<script>
function loadPages() {
    if (!window.FDX || !window.FDX.supabase) return;
    window.FDX.supabase.from('pages').select('*').order('title').then(function(res) {
        if (res.error) return;
        var tbody = document.getElementById('pagesTable');
        if (res.data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">No pages. Run the seed SQL.</td></tr>'; return; }
        tbody.innerHTML = res.data.map(function(p) {
            var badge = p.active ? '<span class="fxg-admin-badge fxg-admin-badge--success">Active</span>' : '<span class="fxg-admin-badge fxg-admin-badge--default">Inactive</span>';
            return '<tr><td>' + p.title + '</td><td>/' + p.slug + '</td><td>' + badge + '</td><td><button class="fxg-admin-btn fxg-admin-btn--outline fxg-admin-btn--small" onclick="togglePage(\'' + p.id + '\',' + (!p.active) + ')">' + (p.active ? 'Deactivate' : 'Activate') + '</button></td></tr>';
        }).join('');
    });
}
function togglePage(id, active) {
    window.FDX.supabase.from('pages').update({ active: active }).eq('id', id).then(function(res) {
        var alert = document.getElementById('pagesAlert');
        if (res.error) { alert.className = 'fxg-admin-alert fxg-admin-alert--error'; alert.textContent = 'Error'; }
        else { alert.textContent = 'Updated!'; loadPages(); }
        alert.style.display = 'block'; setTimeout(function() { alert.style.display = 'none'; }, 3000);
    });
}
loadPages();
</script>
