<div id="adminContent" data-page-type="create">
    <div class="fxg-admin-alert" id="createAlert" style="display:none"></div>

    <div class="fxg-admin-section">
        <div class="fxg-admin-section__header">
            <h2 class="fxg-admin-section__title">Create Shipment</h2>
        </div>

        <div id="newTrackingId" style="display:none;background:#e8f5e9;padding:12px 18px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:600;color:#2e7d32">
            New tracking ID: <span id="newTrackingIdSpan"></span>
        </div>

        <form class="fxg-admin-form" id="createForm">
            <h3>Package Information</h3>
            <div class="fxg-admin-form__row">
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label">Package Image</label>
                    <div class="fxg-admin-image-upload">
                        <div class="fxg-admin-image-upload__preview" id="imagePreview">
                            <div class="fxg-admin-image-upload__preview--empty">Click to upload<br>package image</div>
                        </div>
                        <input type="file" id="packageImage" accept="image/*">
                    </div>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgName">Package Name <span class="required">*</span></label>
                    <input type="text" id="pkgName" class="fxg-admin-form__input" placeholder="e.g. Gift for Mom" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgWeight">Weight (lbs/kg) <span class="required">*</span></label>
                    <input type="text" id="pkgWeight" class="fxg-admin-form__input" placeholder="e.g. 5 lbs" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgService">Service Type <span class="required">*</span></label>
                    <select id="pkgService" class="fxg-admin-form__select" required>
                        <option value="">Select service...</option>
                        <option value="FedEx Ground">FedEx Ground</option>
                        <option value="FedEx Express Saver">FedEx Express Saver</option>
                        <option value="FedEx 2Day">FedEx 2Day</option>
                        <option value="FedEx Standard Overnight">FedEx Standard Overnight</option>
                        <option value="FedEx Priority Overnight">FedEx Priority Overnight</option>
                        <option value="FedEx First Overnight">FedEx First Overnight</option>
                        <option value="FedEx Freight">FedEx Freight</option>
                        <option value="FedEx International Economy">FedEx International Economy</option>
                        <option value="FedEx International Priority">FedEx International Priority</option>
                    </select>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgDeparture">Departure Date <span class="required">*</span></label>
                    <input type="date" id="pkgDeparture" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgDelivery">Est. Delivery Date <span class="required">*</span></label>
                    <input type="date" id="pkgDelivery" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="pkgReference">Reference / PO Number</label>
                    <input type="text" id="pkgReference" class="fxg-admin-form__input" placeholder="e.g. PO-12345">
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__checkbox">
                        <input type="checkbox" id="pkgSignature">
                        Signature Required
                    </label>
                </div>
            </div>

            <h3>Sender Information</h3>
            <div class="fxg-admin-form__row">
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderName">Full Name <span class="required">*</span></label>
                    <input type="text" id="senderName" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderCompany">Company</label>
                    <input type="text" id="senderCompany" class="fxg-admin-form__input">
                </div>
                <div class="fxg-admin-form__group fxg-admin-form__group--full">
                    <label class="fxg-admin-form__label" for="senderAddress">Street Address <span class="required">*</span></label>
                    <input type="text" id="senderAddress" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderCity">City <span class="required">*</span></label>
                    <input type="text" id="senderCity" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderState">State <span class="required">*</span></label>
                    <input type="text" id="senderState" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderZip">ZIP Code <span class="required">*</span></label>
                    <input type="text" id="senderZip" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderCountry">Country <span class="required">*</span></label>
                    <input type="text" id="senderCountry" class="fxg-admin-form__input" value="United States" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderPhone">Phone <span class="required">*</span></label>
                    <input type="tel" id="senderPhone" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="senderEmail">Email <span class="required">*</span></label>
                    <input type="email" id="senderEmail" class="fxg-admin-form__input" required>
                </div>
            </div>

            <h3>Recipient Information</h3>
            <div class="fxg-admin-form__row">
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipName">Full Name <span class="required">*</span></label>
                    <input type="text" id="recipName" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipCompany">Company</label>
                    <input type="text" id="recipCompany" class="fxg-admin-form__input">
                </div>
                <div class="fxg-admin-form__group fxg-admin-form__group--full">
                    <label class="fxg-admin-form__label" for="recipAddress">Street Address <span class="required">*</span></label>
                    <input type="text" id="recipAddress" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipCity">City <span class="required">*</span></label>
                    <input type="text" id="recipCity" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipState">State <span class="required">*</span></label>
                    <input type="text" id="recipState" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipZip">ZIP Code <span class="required">*</span></label>
                    <input type="text" id="recipZip" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipCountry">Country <span class="required">*</span></label>
                    <input type="text" id="recipCountry" class="fxg-admin-form__input" value="United States" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipPhone">Phone <span class="required">*</span></label>
                    <input type="tel" id="recipPhone" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__label" for="recipEmail">Email <span class="required">*</span></label>
                    <input type="email" id="recipEmail" class="fxg-admin-form__input" required>
                </div>
                <div class="fxg-admin-form__group">
                    <label class="fxg-admin-form__checkbox">
                        <input type="checkbox" id="recipResidential">
                        Residential Delivery
                    </label>
                </div>
            </div>

            <div class="fxg-admin-form__actions">
                <button type="submit" class="fxg-admin-btn fxg-admin-btn--success">Create Shipment</button>
                <button type="reset" class="fxg-admin-btn fxg-admin-btn--outline">Clear Form</button>
            </div>
        </form>
    </div>
</div>
