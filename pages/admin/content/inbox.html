<div id="adminContent" data-page-type="inbox">
    <div class="fxg-admin-section">
        <div class="fxg-admin-section__header">
            <h2 class="fxg-admin-section__title">Inbox</h2>
            <div class="fxg-admin-search">
                <input type="text" id="inboxSearch" placeholder="Search sender or subject...">
                <button type="button" class="fxg-admin-btn fxg-admin-btn--outline fxg-admin-btn--small" id="inboxRefresh">Refresh</button>
            </div>
        </div>
        <div class="fxg-inbox" id="inboxList"></div>
        <div class="fxg-admin-empty" id="noInbox" style="display:none">
            <p>No replies yet. Replies to emails sent from @bankofa.online will appear here.</p>
        </div>
    </div>
</div>
