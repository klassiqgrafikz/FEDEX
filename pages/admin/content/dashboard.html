<div class="fxg-admin-section">
    <div class="fxg-admin-section__header">
        <h2 class="fxg-admin-section__title">Dashboard</h2>
        <span style="font-size:13px;color:#999;" id="dashboardDate"></span>
    </div>
</div>
<div class="fxg-admin-stats" id="dashboardStats">
    <div class="fxg-admin-stat"><div class="fxg-admin-stat__label">Total Contacts</div><div class="fxg-admin-stat__value" id="statContacts">—</div></div>
    <div class="fxg-admin-stat"><div class="fxg-admin-stat__label">Unread</div><div class="fxg-admin-stat__value" id="statUnread">—</div></div>
    <div class="fxg-admin-stat"><div class="fxg-admin-stat__label">Blog Posts</div><div class="fxg-admin-stat__value" id="statPosts">—</div></div>
    <div class="fxg-admin-stat"><div class="fxg-admin-stat__label">Content Blocks</div><div class="fxg-admin-stat__value" id="statContent">—</div></div>
</div>
<div class="fxg-admin-section">
    <div class="fxg-admin-section__header">
        <h3 class="fxg-admin-section__title" style="font-size:16px;">Recent Contact Submissions</h3>
    </div>
    <div class="fxg-admin-table">
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="recentContacts"><tr><td colspan="5" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
        </table>
    </div>
</div>
<script>
(function() {
    var d = new Date();
    var el = document.getElementById('dashboardDate');
    if (el) el.textContent = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (!window.FDX || !window.FDX.supabase) return;
    var sb = window.FDX.supabase;
    sb.from('contact_submissions').select('*', { count: 'exact', head: false }).limit(5).order('created_at', { ascending: false }).then(function(res) {
        if (res.error) return;
        var rows = res.data;
        document.getElementById('statContacts').textContent = rows.length;
        var tbody = document.getElementById('recentContacts');
        if (rows.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">No submissions yet</td></tr>'; return; }
        tbody.innerHTML = rows.map(function(r) {
            var date = new Date(r.created_at).toLocaleDateString();
            var badge = r.read ? '<span class="fxg-admin-badge fxg-admin-badge--default">Read</span>' : '<span class="fxg-admin-badge fxg-admin-badge--warning">New</span>';
            return '<tr><td>' + r.name + '</td><td>' + r.email + '</td><td>' + (r.subject || '—') + '</td><td>' + date + '</td><td>' + badge + '</td></tr>';
        }).join('');
    });
    sb.from('contact_submissions').select('*', { count: 'exact', head: true }).then(function(r) { if (!r.error) document.getElementById('statContacts').textContent = r.count; });
    sb.from('contact_submissions').select('*', { count: 'exact', head: true }).eq('read', false).then(function(r) { if (!r.error) document.getElementById('statUnread').textContent = r.count; });
    sb.from('blog_posts').select('*', { count: 'exact', head: true }).then(function(r) { if (!r.error) document.getElementById('statPosts').textContent = r.count; });
    sb.from('site_content').select('*', { count: 'exact', head: true }).then(function(r) { if (!r.error) document.getElementById('statContent').textContent = r.count; });
})();
</script>
