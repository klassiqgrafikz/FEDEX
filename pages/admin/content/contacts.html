<div class="fxg-admin-section">
    <div class="fxg-admin-section__header">
        <h2 class="fxg-admin-section__title">Contact Submissions</h2>
        <button class="fxg-admin-btn fxg-admin-btn--outline fxg-admin-btn--small" onclick="loadContacts()">Refresh</button>
    </div>
</div>
<div class="fxg-admin-table">
    <table>
        <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Date</th><th>Status</th><th style="width:100px">Actions</th></tr></thead>
        <tbody id="contactsTable"><tr><td colspan="7" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
</div>
<script>
function loadContacts() {
    if (!window.FDX || !window.FDX.supabase) return;
    window.FDX.supabase.from('contact_submissions').select('*').order('created_at', { ascending: false }).then(function(res) {
        if (res.error) { document.getElementById('contactsTable').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">Error</td></tr>'; return; }
        var tbody = document.getElementById('contactsTable');
        if (res.data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">No submissions</td></tr>'; return; }
        tbody.innerHTML = res.data.map(function(c) {
            var date = new Date(c.created_at).toLocaleDateString();
            var badge = c.read ? '<span class="fxg-admin-badge fxg-admin-badge--default">Read</span>' : '<span class="fxg-admin-badge fxg-admin-badge--warning">New</span>';
            var msg = c.message.length > 80 ? c.message.substring(0,80) + '...' : c.message;
            var markBtn = c.read ? '' : '<button class="fxg-admin-btn fxg-admin-btn--outline fxg-admin-btn--small" onclick="markRead(\'' + c.id + '\')">Mark Read</button>';
            return '<tr><td>' + c.name + '</td><td>' + c.email + '</td><td>' + (c.subject || '—') + '</td><td>' + msg + '</td><td>' + date + '</td><td>' + badge + '</td><td>' + markBtn + '</td></tr>';
        }).join('');
    });
}
function markRead(id) {
    window.FDX.supabase.from('contact_submissions').update({ read: true }).eq('id', id).then(function() { loadContacts(); });
}
loadContacts();
</script>
