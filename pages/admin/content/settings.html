<div class="fxg-admin-section">
    <div class="fxg-admin-section__header">
        <h2 class="fxg-admin-section__title">Site Settings</h2>
    </div>
    <div id="settingsAlert"></div>
</div>
<div class="fxg-admin-table">
    <table>
        <thead><tr><th>Setting</th><th>Value</th><th style="width:100px">Actions</th></tr></thead>
        <tbody id="settingsTable"><tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
</div>
<script>
function loadSettings() {
    if (!window.FDX || !window.FDX.supabase) return;
    window.FDX.supabase.from('settings').select('*').order('key').then(function(res) {
        if (res.error) return;
        var tbody = document.getElementById('settingsTable');
        if (res.data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">No settings. Run the seed SQL.</td></tr>'; return; }
        tbody.innerHTML = res.data.map(function(s) {
            return '<tr><td>' + s.key + '</td><td>' + s.value + '</td><td><button class="fxg-admin-btn fxg-admin-btn--primary fxg-admin-btn--small" onclick="editSetting(\'' + s.key.replace(/'/g,"\\'") + '\',\'' + s.value.replace(/'/g,"\\'") + '\')">Edit</button></td></tr>';
        }).join('');
    });
}
function editSetting(key, value) {
    var newVal = prompt('Edit "' + key + '":', value);
    if (newVal === null || newVal === value) return;
    window.FDX.supabase.from('settings').update({ value: newVal, updated_at: new Date().toISOString() }).eq('key', key).then(function(res) {
        var alert = document.getElementById('settingsAlert');
        if (res.error) { alert.className = 'fxg-admin-alert fxg-admin-alert--error'; alert.textContent = 'Error: ' + res.error.message; }
        else { alert.className = 'fxg-admin-alert fxg-admin-alert--success'; alert.textContent = 'Updated!'; loadSettings(); }
        alert.style.display = 'block'; setTimeout(function() { alert.style.display = 'none'; }, 3000);
    });
}
loadSettings();
</script>
