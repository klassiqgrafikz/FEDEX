<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FDX Admin</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <div class="fxg-main-content">
        <div class="fxg-admin-login">
    <div class="fxg-admin-login__card">
        <div class="fxg-admin-login__title">FDX Admin</div>
        <div class="fxg-admin-login__subtitle">Sign in to manage shipments</div>
        <div class="fxg-admin-login__error" id="loginError"></div>
        <form id="loginForm">
            <div class="fxg-admin-form__group">
                <label class="fxg-admin-form__label" for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="fxg-admin-form__input" placeholder="admin@example.com" required>
            </div>
            <div class="fxg-admin-form__group">
                <label class="fxg-admin-form__label" for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="fxg-admin-form__input" placeholder="Enter any password" required>
            </div>
            <div style="margin-top:24px">
                <button type="submit" class="fxg-admin-btn fxg-admin-btn--primary" style="width:100%;justify-content:center">Sign In</button>
            </div>
            <p style="text-align:center;margin-top:16px;font-size:12px;color:#999">Enter any email and password to log in (mock auth)</p>
        </form>
    </div>
</div>
    </div>
    <script src="../../script.js"></script>
</body>
</html>
